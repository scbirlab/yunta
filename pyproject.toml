[project]
name = "yunta"
version = "0.0.7"
authors = [
  { name="Eachan Johnson", email="eachan.johnson@crick.ac.uk" },
]
description = "Predicting protein-protein interactions and structures from multiple sequence alignments."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["science", "biology", "systems biology", "biochemistry", "machine learning", "analysis", "deep learning", "alphafold2", "rosettafold"]

classifiers = [  
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",

  "License :: OSI Approved :: MIT License",

  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [ 
  "absl-py",
  "bioino",
  "biopython",
  "carabiner-tools[mpl,pd]>=0.0.5.post3",
  "openpyxl==3.1.0",
  "requests",
  "torch>=2.3",
  "torchvision",
  "tqdm",
]

[project.optional-dependencies]
af_base = [
  "dm-haiku==0.0.12",
  "dm-tree",
  "ml-collections==0.1.0",
  "tensorflow>=2.17",
  "tensorrt",
]
af = [
  "yunta[af_base]",
  "jax<=0.4.35",
]
af_cuda12 = [
  "yunta[af_base]",
  "jax[cuda12]<=0.4.35",
]
af_cuda12_local = [
  "yunta[af_base]",
  "jax[cuda12_local]<=0.4.35",
]
af_cuda11 = [
  "yunta[af_base]",
  "jax[cuda11]<=0.4.35",
]
rf2t = [
  "rf2t-micro",
]
dev = [
  "pytest",
  "flake8",
]

[project.urls]
"Homepage" = "https://github.com/scbirlab/yunta"
"Bug Tracker" = "https://github.com/scbirlab/yunta/issues"

[project.scripts]  # Optional
yunta = "yunta.cli:main"

[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
package-data = {"yunta" = ["data/*.csv"]}

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[test]
deps = ["pytest>=7.4", "pytest-cov", "yunta[dev,af,rf2t]"] 
